services:
  mysql:
    image: mysql:8.0
    container_name: astrology_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uuser", "-puserpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  seeder:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
      target: seeder
    container_name: astrology_seeder
    environment:
      DATABASE_URL: mysql://user:userpassword@mysql:3306/mydb
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - webnet
    restart: on-failure

  app:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
      target: runner
    container_name: astrology_app
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://user:userpassword@mysql:3306/mydb
    depends_on:
      mysql:
        condition: service_healthy
      seeder:
        condition: service_completed_successfully
    expose:
      - "3000"
    networks:
      - webnet

  nginx:
    image: nginx:alpine
    container_name: astrology_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - webnet

networks:
  webnet:

volumes:
  mysql_data: