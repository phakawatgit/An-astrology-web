services:
  mysql:
    image: mysql:8.0
    container_name: astrology_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: userpassword
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - webnet

  app:
    build:
      context: ./app
      dockerfile: Dockerfile.prod
    container_name: astrology_app
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://user:userpassword@mysql:3306/mydb
    depends_on:
      - mysql
    expose:
      - "3000"
    networks:
      - webnet

  nginx:
    image: nginx:latest
    container_name: astrology_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - webnet

networks:
  webnet:

volumes:
  mysql_data: